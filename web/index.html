<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>שחר לימודים</title>
  <style>
    :root {
      --blue:   #007AFF; --green: #34C759; --orange: #FF9500;
      --red:    #FF3B30; --purple:#AF52DE; --teal:   #5AC8FA;
      --pink:   #FF2D55; --brown: #A2845E;
      --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E;
      --secondary: #6C6C70; --tertiary: #AEAEB2;
      --separator: #E5E5EA; --fill: rgba(120,120,128,.10);
      --nav-h: 68px; --r: 12px; --rs: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#000; --card:#1C1C1E; --text:#FFF;
        --secondary:#8E8E93; --tertiary:#3A3A3C;
        --separator:#2C2C2E; --fill:rgba(120,120,128,.18);
      }
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding-bottom:var(--nav-h);direction:rtl}

    /* NAV */
    nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:rgba(255,255,255,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--separator);display:flex;align-items:center;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
    @media(prefers-color-scheme:dark){nav{background:rgba(28,28,30,.88)}}
    .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;background:none;border:none;cursor:pointer;color:var(--tertiary);font-size:9px;font-weight:500;transition:color .15s}
    .nav-btn.active{color:var(--blue)}
    .nav-btn svg{width:22px;height:22px}

    /* PAGE */
    .page{display:none;padding-bottom:16px}
    .page.active{display:block}
    .page-header{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;z-index:50;border-bottom:1px solid var(--separator);display:flex;align-items:center;justify-content:space-between}
    .page-title{font-size:26px;font-weight:700}
    .page-actions{display:flex;gap:8px;align-items:center}
    .icon-btn{width:32px;height:32px;border-radius:50%;background:var(--fill);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--blue)}
    .icon-btn svg{width:17px;height:17px}
    .text-btn{background:none;border:none;cursor:pointer;color:var(--blue);font-size:15px;font-weight:500;padding:4px 8px;border-radius:var(--rs)}
    .content{padding:14px;display:flex;flex-direction:column;gap:14px}

    /* CARDS */
    .card{background:var(--card);border-radius:var(--r);overflow:hidden}
    .card-header{padding:12px 16px 4px;font-size:12px;font-weight:600;color:var(--secondary);letter-spacing:.4px;text-transform:uppercase}

    /* STATS */
    .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .stat-row.two{grid-template-columns:1fr 1fr}
    .stat-card{background:var(--card);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;align-items:center;gap:3px}
    .stat-value{font-size:30px;font-weight:700;line-height:1}
    .stat-label{font-size:11px;color:var(--secondary);text-align:center}

    /* LIST */
    .list-item{padding:11px 16px;border-bottom:1px solid var(--separator);display:flex;align-items:center;gap:10px}
    .list-item:last-child{border-bottom:none}
    .list-body{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
    .list-title{font-size:16px;font-weight:500}
    .list-sub{font-size:13px;color:var(--secondary);display:flex;align-items:center;gap:6px;flex-wrap:wrap}

    /* PRIORITY */
    .pri-bar{width:4px;height:42px;border-radius:2px;flex-shrink:0}

    /* BADGE */
    .badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;flex-shrink:0}

    /* CHECK */
    .check-btn{width:26px;height:26px;border-radius:50%;border:2px solid var(--tertiary);background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:white;transition:all .15s}
    .check-btn.done{background:var(--green);border-color:var(--green)}
    .check-btn svg{width:14px;height:14px}
    .task-done{text-decoration:line-through;color:var(--secondary)}

    /* DELETE */
    .del-btn{background:none;border:none;cursor:pointer;color:var(--tertiary);padding:4px;display:flex;flex-shrink:0}
    .del-btn:hover{color:var(--red)}
    .del-btn svg{width:17px;height:17px}

    /* EMPTY */
    .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 16px;gap:10px;color:var(--secondary)}
    .empty svg{width:44px;height:44px;opacity:.35}
    .empty-title{font-size:17px;font-weight:600;color:var(--text)}
    .empty-sub{font-size:14px;text-align:center}

    /* SUB-TAB */
    .sub-tabs{display:flex;gap:4px;background:var(--fill);border-radius:10px;padding:3px;margin:12px 16px 0}
    .sub-tab{flex:1;padding:7px;border:none;border-radius:7px;background:none;cursor:pointer;font-size:14px;font-weight:500;color:var(--secondary);transition:all .15s}
    .sub-tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}

    /* TIMETABLE */
    .tt-day{margin:0 14px 2px}
    .tt-day-header{display:flex;align-items:center;gap:8px;padding:10px 0 6px}
    .tt-day-name{font-size:14px;font-weight:600;color:var(--secondary)}
    .tt-day-name.today{color:var(--blue)}
    .tt-today-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);flex-shrink:0}
    .tt-classes{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:4px}
    .tt-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--separator)}
    .tt-item:last-child{border-bottom:none}
    .tt-time{font-size:13px;font-weight:600;color:var(--secondary);min-width:90px;flex-shrink:0;text-align:center}
    .tt-bar{width:3px;height:36px;border-radius:2px;flex-shrink:0}
    .tt-info{flex:1;min-width:0}
    .tt-name{font-size:15px;font-weight:500}
    .tt-loc{font-size:12px;color:var(--secondary);margin-top:1px}
    .tt-type-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;color:white;flex-shrink:0}
    .tt-empty{background:var(--card);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--tertiary);margin-bottom:4px}

    /* TODAY CARD */
    .today-card{background:linear-gradient(135deg,#007AFF,#5AC8FA);border-radius:var(--r);padding:16px;color:white}
    .today-card-label{font-size:11px;opacity:.8;margin-bottom:4px}
    .today-card-title{font-size:19px;font-weight:700;margin-bottom:3px}
    .today-card-sub{font-size:13px;opacity:.85}

    /* GRADES */
    .gpa-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border-radius:var(--r)}
    .gpa-val{font-size:36px;font-weight:700;color:var(--blue)}
    .gpa-label{font-size:13px;color:var(--secondary)}
    .grade-row{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--separator)}
    .grade-row:last-child{border-bottom:none}
    .grade-score{font-size:22px;font-weight:700;min-width:48px;text-align:center;flex-shrink:0}
    .grade-info{flex:1;min-width:0}
    .grade-type{font-size:15px;font-weight:500}
    .grade-meta{font-size:12px;color:var(--secondary)}
    .course-avg{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--fill);flex-shrink:0}

    /* NOTES */
    .note-card{background:var(--card);border-radius:var(--r);padding:14px 16px;border-right:4px solid var(--blue)}
    .note-title{font-size:16px;font-weight:600;margin-bottom:4px}
    .note-content{font-size:14px;color:var(--secondary);white-space:pre-wrap;margin-bottom:6px}
    .note-footer{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--tertiary)}

    /* NEXT EVENT CARD */
    .next-event-card{background:linear-gradient(135deg,#007AFF,#5AC8FA);border-radius:var(--r);padding:16px;color:white}

    /* COLOR DOT */
    .cdot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
    .credits-pill{background:var(--fill);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--secondary);flex-shrink:0}

    /* WEEK NAV */
    .week-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--separator)}
    .week-title{font-size:16px;font-weight:600}
    .week-arrow{width:30px;height:30px;border-radius:50%;background:var(--fill);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--blue)}
    .week-arrow svg{width:15px;height:15px}
    .day-row{display:flex;align-items:flex-start;gap:12px;padding:8px 16px;border-bottom:1px solid var(--separator)}
    .day-row:last-child{border-bottom:none}
    .day-label{display:flex;flex-direction:column;align-items:center;gap:2px;width:40px;flex-shrink:0}
    .day-name{font-size:10px;color:var(--secondary)}
    .day-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600}
    .day-num.today{background:var(--blue);color:white}
    .day-events{flex:1;display:flex;flex-direction:column;gap:4px;padding-top:4px}
    .day-empty{font-size:12px;color:var(--tertiary);padding-top:6px}
    .ev-chip{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:var(--rs);font-size:12px}
    .ev-type{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;color:white;flex-shrink:0}
    .ev-name{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ev-time{font-size:11px;color:var(--secondary);flex-shrink:0}

    /* MODAL */
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
    .overlay.open{display:flex}
    .sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:92dvh;display:flex;flex-direction:column;animation:slideUp .22s ease}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .sheet-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--separator);flex-shrink:0}
    .sheet-title{font-size:17px;font-weight:600}
    .sheet-body{overflow-y:auto;flex:1;padding:14px 20px;display:flex;flex-direction:column;gap:14px}

    /* FORM */
    .field{display:flex;flex-direction:column;gap:5px}
    .field label{font-size:12px;font-weight:600;color:var(--secondary);letter-spacing:.3px}
    .field input,.field textarea,.field select{background:var(--fill);border:none;border-radius:var(--rs);padding:10px 12px;font-size:16px;color:var(--text);font-family:inherit;direction:rtl;width:100%;outline:none}
    .field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--blue);outline-offset:-1px}
    .field textarea{min-height:80px;resize:vertical}
    .seg{display:flex;gap:3px;background:var(--fill);border-radius:var(--rs);padding:3px}
    .seg-btn{flex:1;padding:7px 3px;border:none;border-radius:6px;background:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--secondary);transition:all .15s;white-space:nowrap}
    .seg-btn.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
    .color-picker{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
    .cswatch{width:100%;aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;position:relative}
    .cswatch.sel::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2.5px solid var(--blue)}
    .stepper{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:var(--rs);padding:7px 12px}
    .step-btn{width:28px;height:28px;border-radius:50%;background:var(--card);border:none;cursor:pointer;font-size:18px;color:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.1);flex-shrink:0}
    .step-val{flex:1;text-align:center;font-size:16px;font-weight:600}
    .days-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
    .day-pill{border:none;border-radius:8px;background:var(--fill);padding:8px 4px;font-size:12px;font-weight:600;cursor:pointer;color:var(--secondary);transition:all .15s;text-align:center}
    .day-pill.active{background:var(--blue);color:white}
    .btn-primary{background:var(--blue);color:white;border:none;border-radius:var(--r);padding:14px;font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-top:4px}
    .btn-primary:hover{opacity:.9}
    .btn-primary:disabled{opacity:.4;cursor:not-allowed}

    @media(min-width:600px){body{max-width:600px;margin:0 auto}}
  </style>
</head>
<body>

<!-- ══ PAGES ══════════════════════════════════════════ -->

<!-- DASHBOARD -->
<div class="page active" id="page-dashboard">
  <div class="page-header">
    <div class="page-title">שחר לימודים</div>
  </div>
  <div class="content" id="dash-content"></div>
</div>

<!-- TASKS + NOTES -->
<div class="page" id="page-tasks">
  <div class="page-header">
    <div class="page-title" id="tasks-header-title">מטלות</div>
    <div class="page-actions">
      <button class="filter-btn text-btn" id="tasks-filter-btn" onclick="toggleTasksFilter()" style="font-size:13px;padding:4px 10px;background:var(--fill);border-radius:20px;color:var(--blue)">הושלמו</button>
      <button class="icon-btn" id="tasks-add-btn" onclick="openAddForSubTab()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>
  <div class="sub-tabs">
    <button class="sub-tab active" id="subtab-tasks" onclick="setTasksSubTab('tasks')">מטלות</button>
    <button class="sub-tab" id="subtab-notes" onclick="setTasksSubTab('notes')">נוטס</button>
  </div>
  <div class="content" id="tasks-content"></div>
</div>

<!-- TIMETABLE -->
<div class="page" id="page-timetable">
  <div class="page-header">
    <div class="page-title">מערכת שעות</div>
    <div class="page-actions">
      <button class="icon-btn" onclick="openSheet('tt-sheet')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>
  <div id="tt-content" style="padding:10px 0 16px"></div>
</div>

<!-- SCHEDULE -->
<div class="page" id="page-schedule">
  <div class="page-header">
    <div class="page-title">אירועים</div>
    <div class="page-actions">
      <button class="text-btn" onclick="resetWeek()">היום</button>
      <button class="icon-btn" onclick="openSheet('ev-sheet')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>
  <div id="sched-content"></div>
</div>

<!-- COURSES + GRADES -->
<div class="page" id="page-courses">
  <div class="page-header">
    <div class="page-title" id="courses-header-title">קורסים</div>
    <div class="page-actions">
      <button class="icon-btn" id="courses-add-btn" onclick="openAddForCoursesSubTab()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>
  <div class="sub-tabs">
    <button class="sub-tab active" id="subtab-courses" onclick="setCoursesSubTab('courses')">קורסים</button>
    <button class="sub-tab" id="subtab-grades" onclick="setCoursesSubTab('grades')">ציונים</button>
  </div>
  <div class="content" id="courses-content"></div>
</div>

<!-- ══ NAV ════════════════════════════════════════════ -->
<nav>
  <button class="nav-btn active" id="nav-dashboard" onclick="switchTab('dashboard')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>בית
  </button>
  <button class="nav-btn" id="nav-tasks" onclick="switchTab('tasks')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>מטלות
  </button>
  <button class="nav-btn" id="nav-timetable" onclick="switchTab('timetable')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>שעות
  </button>
  <button class="nav-btn" id="nav-schedule" onclick="switchTab('schedule')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>לוז
  </button>
  <button class="nav-btn" id="nav-courses" onclick="switchTab('courses')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>קורסים
  </button>
</nav>

<!-- ══ MODALS ══════════════════════════════════════════ -->

<!-- ADD TASK -->
<div class="overlay" id="task-sheet" onclick="bgClose(event,'task-sheet')">
  <div class="sheet">
    <div class="sheet-header">
      <button class="text-btn" onclick="closeSheet('task-sheet')">ביטול</button>
      <span class="sheet-title">מטלה חדשה</span>
      <button class="text-btn" onclick="saveTask()" style="font-weight:700">שמור</button>
    </div>
    <div class="sheet-body">
      <div class="field"><label>שם המטלה</label><input type="text" id="t-title" placeholder="לדוגמה: עבודה סמינריונית"></div>
      <div class="field"><label>הערות</label><textarea id="t-notes" placeholder="פרטים..."></textarea></div>
      <div class="field"><label>תאריך הגשה</label><input type="datetime-local" id="t-due"></div>
      <div class="field">
        <label>עדיפות</label>
        <div class="seg" id="pri-seg">
          <button class="seg-btn" data-val="low" onclick="segClick('pri-seg',this)">נמוך</button>
          <button class="seg-btn active" data-val="medium" onclick="segClick('pri-seg',this)">בינוני</button>
          <button class="seg-btn" data-val="high" onclick="segClick('pri-seg',this)">גבוה</button>
        </div>
      </div>
      <div class="field"><label>קורס</label><select id="t-course"><option value="">ללא קורס</option></select></div>
      <button class="btn-primary" onclick="saveTask()">שמור מטלה</button>
    </div>
  </div>
</div>

<!-- ADD NOTE -->
<div class="overlay" id="note-sheet" onclick="bgClose(event,'note-sheet')">
  <div class="sheet">
    <div class="sheet-header">
      <button class="text-btn" onclick="closeSheet('note-sheet')">ביטול</button>
      <span class="sheet-title">נוט חדש</span>
      <button class="text-btn" onclick="saveNote()" style="font-weight:700">שמור</button>
    </div>
    <div class="sheet-body">
      <div class="field"><label>כותרת</label><input type="text" id="n-title" placeholder="כותרת הנוט"></div>
      <div class="field"><label>תוכן</label><textarea id="n-content" placeholder="רשום כאן..." style="min-height:120px"></textarea></div>
      <div class="field"><label>קורס</label><select id="n-course"><option value="">כללי</option></select></div>
      <button class="btn-primary" onclick="saveNote()">שמור נוט</button>
    </div>
  </div>
</div>

<!-- ADD TIMETABLE ENTRY -->
<div class="overlay" id="tt-sheet" onclick="bgClose(event,'tt-sheet')">
  <div class="sheet">
    <div class="sheet-header">
      <button class="text-btn" onclick="closeSheet('tt-sheet')">ביטול</button>
      <span class="sheet-title">שיעור חדש</span>
      <button class="text-btn" onclick="saveTT()" style="font-weight:700">שמור</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label>יום</label>
        <div class="days-picker" id="days-picker">
          <button class="day-pill" data-day="0" onclick="pickDay(0)">א׳</button>
          <button class="day-pill" data-day="1" onclick="pickDay(1)">ב׳</button>
          <button class="day-pill" data-day="2" onclick="pickDay(2)">ג׳</button>

<!-- ══ JS ══════════════════════════════════════════════ -->
<script>
'use strict';

// ── STORAGE ──────────────────────────────────────────
const LD = k => { try { return JSON.parse(localStorage.getItem(k)||'[]'); } catch { return []; } };
const SV = (k,v) => localStorage.setItem(k, JSON.stringify(v));
const UID = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)+Date.now());

const S = {
  courses:   LD('sc_courses'),
  tasks:     LD('sc_tasks'),
  events:    LD('sc_events'),
  timetable: LD('sc_tt'),
  grades:    LD('sc_grades'),
  notes:     LD('sc_notes'),
  tab: 'dashboard',
  showDone: false,
  tasksSubTab: 'tasks',
  coursesSubTab: 'courses',
  weekOffset: 0,
  ttDay: 0,
  cCreds: 3,
  cColor: '#007AFF',
};

function persist(){ SV('sc_courses',S.courses); SV('sc_tasks',S.tasks); SV('sc_events',S.events); SV('sc_tt',S.timetable); SV('sc_grades',S.grades); SV('sc_notes',S.notes); }

// ── CONSTANTS ─────────────────────────────────────────
const PALETTE = ['#007AFF','#34C759','#FF3B30','#FF9500','#AF52DE','#5AC8FA','#FF2D55','#A2845E'];
const PRI_COL = {low:'#34C759',medium:'#FF9500',high:'#FF3B30'};
const PRI_LBL = {low:'נמוך',medium:'בינוני',high:'גבוה'};
const EV_COL  = {lesson:'#007AFF',exam:'#FF3B30',submission:'#FF9500'};
const EV_LBL  = {lesson:'שיעור',exam:'בחינה',submission:'הגשה'};
const TT_COL  = {הרצאה:'#007AFF',תרגיל:'#34C759',מעבדה:'#AF52DE',סמינר:'#FF9500'};
const HE_DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const HE_SHORT= ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const HE_MON  = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

// ── HELPERS ───────────────────────────────────────────
function H(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function courseById(id){ return S.courses.find(c=>c.id===id); }
function fmtDate(d){ const x=new Date(d); return isNaN(x)?'' : `${x.getDate()} ${HE_MON[x.getMonth()]}`; }
function fmtTime(d){ const x=new Date(d); return isNaN(x)?'' : x.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}); }
function fmtDT(d){ return fmtDate(d)+' '+fmtTime(d); }
function isToday(d){ const x=new Date(d),t=new Date(); return x.getFullYear()===t.getFullYear()&&x.getMonth()===t.getMonth()&&x.getDate()===t.getDate(); }
function isSameDay(a,b){ const x=new Date(a),y=new Date(b); return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate(); }
function isPast(d){ return new Date(d)<new Date(); }
function isTomorrow(d){ const x=new Date(d),t=new Date(); t.setDate(t.getDate()+1); return x.getFullYear()===t.getFullYear()&&x.getMonth()===t.getMonth()&&x.getDate()===t.getDate(); }
function todayDow(){ return new Date().getDay(); }
function gradeColor(g){ return g>=90?'#34C759':g>=75?'#007AFF':g>=60?'#FF9500':'#FF3B30'; }

function courseAvg(courseId){
  const gg = S.grades.filter(g=>g.courseId===courseId);
  if(!gg.length) return null;
  const tw = gg.reduce((s,g)=>s+g.weight,0);
  if(!tw) return null;
  return gg.reduce((s,g)=>s+(g.grade*g.weight),0)/tw;
}
function overallGPA(){
  const avgs = S.courses.map(c=>courseAvg(c.id)).filter(x=>x!==null);
  if(!avgs.length) return null;
  return avgs.reduce((s,v)=>s+v,0)/avgs.length;
}

// ── WEEK DATES ────────────────────────────────────────
function weekDates(){
  const t=new Date(), dow=t.getDay();
  const sun=new Date(t); sun.setDate(t.getDate()-dow+S.weekOffset*7); sun.setHours(0,0,0,0);
  return Array.from({length:7},(_,i)=>{ const d=new Date(sun); d.setDate(sun.getDate()+i); return d; });
}

// ── TAB ───────────────────────────────────────────────
function switchTab(tab){
  S.tab=tab;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
  render();
}

function setTasksSubTab(t){
  S.tasksSubTab=t;
  ['tasks','notes'].forEach(x=>{ document.getElementById('subtab-'+x).classList.toggle('active',x===t); });
  const isTask = t==='tasks';
  document.getElementById('tasks-header-title').textContent = isTask?'מטלות':'נוטס';
  document.getElementById('tasks-filter-btn').style.display = isTask?'':'none';
  renderTasks();
}

function setCoursesSubTab(t){
  S.coursesSubTab=t;
  ['courses','grades'].forEach(x=>{ document.getElementById('subtab-'+x).classList.toggle('active',x===t); });
  document.getElementById('courses-header-title').textContent = t==='courses'?'קורסים':'ציונים';
  renderCourses();
}

function openAddForSubTab(){
  if(S.tasksSubTab==='tasks') openSheet('task-sheet');
  else openSheet('note-sheet');
}
function openAddForCoursesSubTab(){
  if(S.coursesSubTab==='courses') openSheet('course-sheet');
  else openSheet('grade-sheet');
}

function render(){
  if(S.tab==='dashboard') renderDash();
  if(S.tab==='tasks')     renderTasks();
  if(S.tab==='timetable') renderTT();
  if(S.tab==='schedule')  renderSched();
  if(S.tab==='courses')   renderCourses();
}

// ── EMPTY STATE ───────────────────────────────────────
function emptyHtml(title,sub,icon='checklist'){
  const icons={
    checklist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
    book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
    cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
    note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
    grade:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="6"/><path d="M9 13H5a2 2 0 0 0-2 2l3 6 3-3 3 3 3-6a2 2 0 0 0-2-2h-4z"/></svg>',
  };
  return `<div class="empty">${icons[icon]||''}<div class="empty-title">${title}</div>${sub?`<div class="empty-sub">${sub}</div>`:''}</div>`;
}

// ── DASHBOARD ─────────────────────────────────────────
function renderDash(){
  const now=new Date(), dow=now.getDay();
  const pending=S.tasks.filter(t=>!t.isCompleted);
  const weekEnd=new Date(now); weekEnd.setDate(now.getDate()+7);
  const evWk=S.events.filter(e=>new Date(e.startDate)>=now&&new Date(e.startDate)<=weekEnd).length;
  const gpa=overallGPA();
  const upcoming=pending.filter(t=>new Date(t.dueDate)<=new Date(now.getTime()+2*86400000)).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate)).slice(0,4);
  const nextEv=S.events.filter(e=>new Date(e.startDate)>=now).sort((a,b)=>new Date(a.startDate)-new Date(b.startDate))[0];

  // today's timetable classes
  const todayClasses=S.timetable.filter(c=>c.dayOfWeek===dow).sort((a,b)=>a.startTime.localeCompare(b.startTime));
  const currentClass=todayClasses.find(c=>{ const [sh,sm]=c.startTime.split(':').map(Number); const [eh,em]=c.endTime.split(':').map(Number); const cn=now.getHours()*60+now.getMinutes(); return cn>=sh*60+sm && cn<=eh*60+em; });
  const nextClass=!currentClass && todayClasses.find(c=>{ const [sh,sm]=c.startTime.split(':').map(Number); return now.getHours()*60+now.getMinutes()<sh*60+sm; });

  let html='';

  // stats
  html+=`<div class="stat-row">
    <div class="stat-card"><div class="stat-value" style="color:var(--orange)">${pending.length}</div><div class="stat-label">מטלות פתוחות</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--blue)">${evWk}</div><div class="stat-label">אירועים השבוע</div></div>
    <div class="stat-card"><div class="stat-value" style="color:${gpa?gradeColor(gpa):'var(--tertiary)'}">${gpa?gpa.toFixed(1):'—'}</div><div class="stat-label">ממוצע כללי</div></div>
  </div>`;

  // current/next class
  if(currentClass||nextClass){
    const cls=currentClass||nextClass;
    const course=courseById(cls.courseId);
    const col=(course&&Color(course.colorHex))||'var(--blue)';
    const label=currentClass?'שיעור עכשיו':'שיעור הבא היום';
    html+=`<div class="today-card" style="background:linear-gradient(135deg,${col},${col}cc)">
      <div class="today-card-label">${label}</div>
      <div class="today-card-title">${H(course?course.name:cls.lessonType)}</div>
      <div class="today-card-sub">${cls.startTime}–${cls.endTime}${cls.location?' · '+H(cls.location):''} · ${H(cls.lessonType)}</div>
    </div>`;
  }

  // next one-time event
  if(nextEv){
    html+=`<div class="next-event-card">
      <div style="font-size:11px;opacity:.8;margin-bottom:4px">האירוע הבא</div>
      <div style="font-size:19px;font-weight:700;margin-bottom:3px">${H(nextEv.title)}</div>
      <div style="font-size:13px;opacity:.85">${fmtDT(nextEv.startDate)}${nextEv.location?' · '+H(nextEv.location):''}</div>
    </div>`;
  }

  // upcoming tasks
  if(upcoming.length){
    html+=`<div class="card"><div class="card-header">מטלות קרובות</div>`;
    upcoming.forEach(t=>{
      const c=courseById(t.courseId);
      const col=PRI_COL[t.priority]||'#8E8E93';
      const dc=isPast(t.dueDate)?'var(--red)':isTomorrow(t.dueDate)?'var(--orange)':'var(--secondary)';
      html+=`<div class="list-item">
        <div class="list-body"><div class="list-title">${H(t.title)}</div>
        <div class="list-sub">${c?`<span style="color:${c.colorHex}">${H(c.name)}</span>`:''}<span style="color:${dc}">${fmtDT(t.dueDate)}</span></div></div>
        <div class="pri-bar" style="background:${col}"></div>
      </div>`;
    });
    html+=`</div>`;
  } else if(!S.tasks.length){
    html+=emptyHtml('ברוכים הבאים!','התחל בהוספת קורסים ומטלות','book');
  }

  document.getElementById('dash-content').innerHTML=html;
}

function Color(hex){ return hex||null; } // passthrough for readability

// ── TASKS / NOTES ─────────────────────────────────────
function toggleTasksFilter(){ S.showDone=!S.showDone; document.getElementById('tasks-filter-btn').textContent=S.showDone?'פתוחות':'הושלמו'; renderTasks(); }

function renderTasks(){
  const el=document.getElementById('tasks-content');
  if(S.tasksSubTab==='notes'){ renderNotes(el); return; }

  const list=S.tasks.filter(t=>S.showDone?t.isCompleted:!t.isCompleted).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
  if(!list.length){ el.innerHTML=emptyHtml(S.showDone?'אין מטלות שהושלמו':'אין מטלות פתוחות',S.showDone?'':'לחץ + להוסיף'); return; }

  let html=`<div class="card">`;
  list.forEach(t=>{
    const c=courseById(t.courseId);
    const col=PRI_COL[t.priority]||'#8E8E93';
    const dc=t.isCompleted?'var(--secondary)':isPast(t.dueDate)?'var(--red)':isTomorrow(t.dueDate)?'var(--orange)':'var(--secondary)';
    html+=`<div class="list-item">
      <button class="check-btn ${t.isCompleted?'done':''}" onclick="toggleTask('${t.id}')">
        ${t.isCompleted?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>':''}
      </button>
      <div class="list-body">
        <div class="list-title ${t.isCompleted?'task-done':''}">${H(t.title)}</div>
        <div class="list-sub">
          ${c?`<span style="color:${c.colorHex}">${H(c.name)}</span>`:''}
          <span style="color:${dc}">${fmtDT(t.dueDate)}</span>
          <span class="badge" style="background:${col}22;color:${col}">${PRI_LBL[t.priority]||''}</span>
        </div>
        ${t.notes?`<div style="font-size:12px;color:var(--secondary);margin-top:2px">${H(t.notes)}</div>`:''}
      </div>
      <div class="pri-bar" style="background:${col}"></div>
      <button class="del-btn" onclick="delTask('${t.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>
    </div>`;
  });
  html+=`</div>`;
  el.innerHTML=html;
}

function renderNotes(el){
  const list=[...S.notes].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(!list.length){ el.innerHTML=emptyHtml('אין נוטס','לחץ + כדי לרשום הערה','note'); return; }
  let html='';
  list.forEach(n=>{
    const c=courseById(n.courseId);
    const col=(c&&c.colorHex)||'var(--blue)';
    const d=new Date(n.createdAt); const dateStr=`${d.getDate()} ${HE_MON[d.getMonth()]}`;
    html+=`<div class="note-card" style="border-color:${col}">
      <div class="note-title">${H(n.title)}</div>
      <div class="note-content">${H(n.content)}</div>
      <div class="note-footer">
        <span style="color:${col}">${c?H(c.name):'כללי'}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span>${dateStr}</span>
          <button class="del-btn" onclick="delNote('${n.id}')" style="padding:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
        </div>
      </div>
    </div>`;
  });
  el.innerHTML=html;
}

// ── TIMETABLE ─────────────────────────────────────────
function renderTT(){
  const dow=todayDow();
  let html='';
  for(let d=0;d<7;d++){
    const classes=S.timetable.filter(c=>c.dayOfWeek===d).sort((a,b)=>a.startTime.localeCompare(b.startTime));
    const isD=(d===dow);
    html+=`<div class="tt-day">
      <div class="tt-day-header">
        ${isD?'<div class="tt-today-dot"></div>':''}
        <span class="tt-day-name ${isD?'today':''}">${HE_DAYS[d]}${isD?' (היום)':''}</span>
      </div>`;
    if(!classes.length){
      html+=`<div class="tt-empty">אין שיעורים</div>`;
    } else {
      html+=`<div class="tt-classes">`;
      classes.forEach(c=>{
        const course=courseById(c.courseId);
        const col=(course&&course.colorHex)||TT_COL[c.lessonType]||'#007AFF';
        const typCol=TT_COL[c.lessonType]||'#8E8E93';
        html+=`<div class="tt-item">
          <div class="tt-time">${c.startTime}<br><span style="color:var(--tertiary);font-size:11px">${c.endTime}</span></div>
          <div class="tt-bar" style="background:${col}"></div>
          <div class="tt-info">
            <div class="tt-name">${H(course?course.name:c.lessonType)}</div>
            ${c.location?`<div class="tt-loc">📍 ${H(c.location)}</div>`:''}
          </div>
          <span class="tt-type-badge" style="background:${typCol}">${H(c.lessonType)}</span>
          <button class="del-btn" onclick="delTT('${c.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>`;
      });
      html+=`</div>`;
    }
    html+=`</div>`;
  }
  document.getElementById('tt-content').innerHTML=html;
}

// ── SCHEDULE ──────────────────────────────────────────
function renderSched(){
  const days=weekDates();
  const month=`${HE_MON[days[0].getMonth()]} ${days[0].getFullYear()}`;
  let html=`<div class="card" style="margin:14px">
    <div class="week-nav">
      <button class="week-arrow" onclick="chWeek(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>
      <span class="week-title">${month}</span>
      <button class="week-arrow" onclick="chWeek(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>`;
  days.forEach(day=>{
    const evs=S.events.filter(e=>isSameDay(e.startDate,day)).sort((a,b)=>new Date(a.startDate)-new Date(b.startDate));
    html+=`<div class="day-row">
      <div class="day-label"><span class="day-name">${HE_SHORT[day.getDay()]}</span><span class="day-num ${isToday(day)?'today':''}">${day.getDate()}</span></div>
      <div class="day-events">`;
    if(!evs.length){ html+=`<span class="day-empty">אין אירועים</span>`; }
    else { evs.forEach(e=>{ const col=EV_COL[e.eventType]||'#007AFF';
      html+=`<div class="ev-chip" style="background:${col}18;border:1px solid ${col}44">
        <span class="ev-type" style="background:${col}">${EV_LBL[e.eventType]||e.eventType}</span>
        <span class="ev-name">${H(e.title)}</span>
        <span class="ev-time">${fmtTime(e.startDate)}</span>
        <button class="del-btn" onclick="delEvent('${e.id}')" style="margin-right:2px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>`;
    }); }
    html+=`</div></div>`;
  });
  html+=`</div>`;
  document.getElementById('sched-content').innerHTML=html;
}

// ── COURSES / GRADES ──────────────────────────────────
function renderCourses(){
  const el=document.getElementById('courses-content');
  if(S.coursesSubTab==='grades'){ renderGrades(el); return; }

  if(!S.courses.length){ el.innerHTML=emptyHtml('אין קורסים','לחץ + להוסיף קורס','book'); return; }
  let html=`<div class="card">`;
  S.courses.forEach(c=>{
    const tc=S.tasks.filter(t=>t.courseId===c.id&&!t.isCompleted).length;
    const avg=courseAvg(c.id);
    html+=`<div class="list-item">
      <div class="cdot" style="background:${c.colorHex}"></div>
      <div class="list-body">
        <div class="list-title">${H(c.name)}</div>
        <div class="list-sub">
          ${c.lecturer?`<span>${H(c.lecturer)}</span>`:''}
          ${tc>0?`<span style="color:var(--orange)">${tc} מטלות</span>`:''}
          ${avg!==null?`<span style="color:${gradeColor(avg)}">ממוצע: ${avg.toFixed(1)}</span>`:''}
        </div>
      </div>
      <span class="credits-pill">${c.credits} נק"ז</span>
      <button class="del-btn" onclick="delCourse('${c.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>
    </div>`;
  });
  html+=`</div>`;
  el.innerHTML=html;
}

function renderGrades(el){
  const gpa=overallGPA();
  let html='';

  // GPA header
  html+=`<div class="gpa-header">
    <div>
      <div class="gpa-label">ממוצע כללי</div>
      <div style="font-size:13px;color:var(--secondary)">${S.courses.length} קורסים · ${S.grades.length} ציונים</div>
    </div>
    <div class="gpa-val" style="color:${gpa?gradeColor(gpa):'var(--tertiary)'}">${gpa?gpa.toFixed(1):'—'}</div>
  </div>`;

  if(!S.grades.length){ html+=emptyHtml('אין ציונים עדיין','לחץ + להוסיף ציון','grade'); el.innerHTML=html; return; }

  // Group by course
  const byCourse={};
  S.grades.forEach(g=>{ if(!byCourse[g.courseId]) byCourse[g.courseId]=[]; byCourse[g.courseId].push(g); });

  Object.entries(byCourse).forEach(([cid,gg])=>{
    const course=courseById(cid);
    const avg=courseAvg(cid);
    html+=`<div class="card">
      <div class="card-header" style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px">
        <div style="display:flex;align-items:center;gap:8px">
          ${course?`<div class="cdot" style="background:${course.colorHex}"></div>`:''}
          <span>${H(course?course.name:'ללא קורס')}</span>
        </div>
        ${avg!==null?`<span style="font-size:16px;font-weight:700;color:${gradeColor(avg)}">${avg.toFixed(1)}</span>`:''}
      </div>`;
    gg.sort((a,b)=>b.grade-a.grade).forEach(g=>{
      html+=`<div class="grade-row">
        <div class="grade-score" style="color:${gradeColor(g.grade)}">${g.grade}</div>
        <div class="grade-info">
          <div class="grade-type">${H(g.type)}</div>
          <div class="grade-meta">משקל: ${g.weight}%${g.noteText?' · '+H(g.noteText):''}</div>
        </div>
        <button class="del-btn" onclick="delGrade('${g.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
      </div>`;
    });
    html+=`</div>`;
  });
  el.innerHTML=html;
}

// ── CRUD ──────────────────────────────────────────────
function toggleTask(id){ const t=S.tasks.find(t=>t.id===id); if(t){t.isCompleted=!t.isCompleted;persist();render();} }
function delTask(id){ S.tasks=S.tasks.filter(t=>t.id!==id); persist(); render(); }
function delEvent(id){ S.events=S.events.filter(e=>e.id!==id); persist(); render(); }
function delTT(id){ S.timetable=S.timetable.filter(c=>c.id!==id); persist(); render(); }
function delNote(id){ S.notes=S.notes.filter(n=>n.id!==id); persist(); render(); }
function delGrade(id){ S.grades=S.grades.filter(g=>g.id!==id); persist(); render(); }
function delCourse(id){
  if(!confirm('למחוק את הקורס?')) return;
  S.courses=S.courses.filter(c=>c.id!==id);
  S.tasks.forEach(t=>{if(t.courseId===id)t.courseId='';});
  S.timetable.forEach(t=>{if(t.courseId===id)t.courseId='';});
  S.grades=S.grades.filter(g=>g.courseId!==id);
  S.notes.forEach(n=>{if(n.courseId===id)n.courseId='';});
  persist(); render();
}
function chWeek(d){ S.weekOffset+=d; renderSched(); }
function resetWeek(){ S.weekOffset=0; renderSched(); }

// ── SAVE FORMS ────────────────────────────────────────
function saveTask(){
  const title=document.getElementById('t-title').value.trim();
  if(!title){ document.getElementById('t-title').focus(); return; }
  S.tasks.push({ id:UID(), title, notes:document.getElementById('t-notes').value.trim(),
    dueDate:document.getElementById('t-due').value||new Date().toISOString(),
    priority:segVal('pri-seg'), isCompleted:false, courseId:document.getElementById('t-course').value });
  persist(); closeSheet('task-sheet'); clearFields('t-title','t-notes','t-due'); segReset('pri-seg','medium'); render();
}

function saveNote(){
  const title=document.getElementById('n-title').value.trim();
  const content=document.getElementById('n-content').value.trim();
  if(!title&&!content){ document.getElementById('n-title').focus(); return; }
  S.notes.push({ id:UID(), title:title||'ללא כותרת', content, courseId:document.getElementById('n-course').value, createdAt:new Date().toISOString() });
  persist(); closeSheet('note-sheet'); clearFields('n-title','n-content'); render();
}

function saveTT(){
  const courseId=document.getElementById('tt-course').value;
  const lessonType=segVal('tt-type-seg');
  const course=courseById(courseId);
  if(!course&&!lessonType){ alert('יש לבחור קורס או סוג שיעור'); return; }
  S.timetable.push({ id:UID(), courseId, dayOfWeek:S.ttDay,
    startTime:document.getElementById('tt-start').value||'10:00',
    endTime:document.getElementById('tt-end').value||'12:00',
    location:document.getElementById('tt-loc').value.trim(),
    lessonType });
  persist(); closeSheet('tt-sheet'); clearFields('tt-loc'); render();
}

function saveEvent(){
  const title=document.getElementById('ev-title').value.trim();
  if(!title){ document.getElementById('ev-title').focus(); return; }
  const start=document.getElementById('ev-start').value;
  const end=document.getElementById('ev-end').value||start;
  S.events.push({ id:UID(), title, location:document.getElementById('ev-loc').value.trim(),
    eventType:segVal('ev-type-seg'), startDate:start||new Date().toISOString(),
    endDate:end||new Date().toISOString(), courseId:document.getElementById('ev-course').value });
  persist(); closeSheet('ev-sheet'); clearFields('ev-title','ev-loc','ev-start','ev-end'); segReset('ev-type-seg','lesson'); render();
}

function saveCourse(){
  const name=document.getElementById('c-name').value.trim();
  if(!name){ document.getElementById('c-name').focus(); return; }
  S.courses.push({ id:UID(), name, lecturer:document.getElementById('c-lec').value.trim(), credits:S.cCreds, colorHex:S.cColor });
  persist(); closeSheet('course-sheet'); clearFields('c-name','c-lec'); S.cCreds=3; S.cColor='#007AFF'; render();
}

function saveGrade(){
  const courseId=document.getElementById('g-course').value;
  const grade=Number(document.getElementById('g-grade').value);
  const weight=Number(document.getElementById('g-weight').value);
  if(!courseId){ document.getElementById('g-course').focus(); return; }
  if(isNaN(grade)||grade<0||grade>100){ alert('ציון חייב להיות בין 0 ל-100'); return; }
  if(isNaN(weight)||weight<=0){ alert('יש להזין משקל'); return; }
  S.grades.push({ id:UID(), courseId, type:segVal('grade-type-seg'), grade, weight, noteText:document.getElementById('g-note').value.trim() });
  persist(); closeSheet('grade-sheet'); clearFields('g-grade','g-weight','g-note'); render();
}

// ── FORM HELPERS ──────────────────────────────────────
function clearFields(...ids){ ids.forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; }); }
function segClick(segId,btn){ document.querySelectorAll(`#${segId} .seg-btn`).forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
function segVal(segId){ const a=document.querySelector(`#${segId} .seg-btn.active`); return a?a.dataset.val:''; }
function segReset(segId,val){ const b=document.querySelector(`#${segId} .seg-btn[data-val="${val}"]`); if(b){ document.querySelectorAll(`#${segId} .seg-btn`).forEach(x=>x.classList.remove('active')); b.classList.add('active'); } }
function chCr(d){ S.cCreds=Math.max(1,Math.min(6,S.cCreds+d)); document.getElementById('cr-val').textContent=S.cCreds; }
function pickDay(d){ S.ttDay=d; document.querySelectorAll('.day-pill').forEach(b=>b.classList.toggle('active',Number(b.dataset.day)===d)); }
function selectColor(hex){ S.cColor=hex; document.querySelectorAll('.cswatch').forEach(s=>s.classList.toggle('sel',s.dataset.c===hex)); }

// ── SHEET ─────────────────────────────────────────────
function fillCourseSelects(){
  ['t-course','ev-course','tt-course','n-course','g-course'].forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    const cur=el.value; const none=id==='g-course'?'<option value="">בחר קורס</option>':'<option value="">ללא קורס</option>';
    el.innerHTML=none+S.courses.map(c=>`<option value="${c.id}"${c.id===cur?' selected':''}>${H(c.name)}</option>`).join('');
  });
}
function openSheet(id){
  fillCourseSelects();
  if(id==='task-sheet'){ const d=new Date(); d.setDate(d.getDate()+1); d.setMinutes(0,0,0); document.getElementById('t-due').value=d.toISOString().slice(0,16); }
  if(id==='ev-sheet'){ const s=new Date(); s.setMinutes(0,0,0); const e=new Date(s); e.setHours(s.getHours()+2); document.getElementById('ev-start').value=s.toISOString().slice(0,16); document.getElementById('ev-end').value=e.toISOString().slice(0,16); }
  if(id==='tt-sheet'){ pickDay(todayDow()); }
  document.getElementById(id).classList.add('open');
}
function closeSheet(id){ document.getElementById(id).classList.remove('open'); }
function bgClose(e,id){ if(e.target===e.currentTarget) closeSheet(id); }

// ── INIT ──────────────────────────────────────────────
function initColorPicker(){
  document.getElementById('cpick').innerHTML=PALETTE.map(h=>`<button class="cswatch ${h===S.cColor?'sel':''}" data-c="${h}" style="background:${h}" onclick="selectColor('${h}')"></button>`).join('');
}

initColorPicker();
render();
</script>
