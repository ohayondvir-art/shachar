<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>שחר לימודים</title>
  <style>
    :root {
      --blue:   #007AFF;
      --green:  #34C759;
      --orange: #FF9500;
      --red:    #FF3B30;
      --purple: #AF52DE;
      --teal:   #5AC8FA;
      --pink:   #FF2D55;
      --brown:  #A2845E;

      --bg:        #F2F2F7;
      --card:      #FFFFFF;
      --text:      #1C1C1E;
      --secondary: #6C6C70;
      --tertiary:  #AEAEB2;
      --separator: #E5E5EA;
      --fill:      rgba(120,120,128,0.10);

      --nav-h: 72px;
      --r:  12px;
      --rs: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #000000;
        --card:      #1C1C1E;
        --text:      #FFFFFF;
        --secondary: #8E8E93;
        --tertiary:  #3A3A3C;
        --separator: #2C2C2E;
        --fill:      rgba(120,120,128,0.18);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding-bottom: var(--nav-h);
      direction: rtl;
    }

    /* ── NAV BAR ── */
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--separator);
      display: flex;
      align-items: center;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    @media (prefers-color-scheme: dark) {
      nav { background: rgba(28,28,30,0.88); }
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 0;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--tertiary);
      font-size: 10px;
      font-weight: 500;
      transition: color .15s;
    }
    .nav-btn.active { color: var(--blue); }
    .nav-btn svg { width: 24px; height: 24px; }

    /* ── PAGE ── */
    .page { display: none; padding: 0 0 16px; }
    .page.active { display: block; }

    .page-header {
      position: sticky;
      top: 0;
      background: var(--bg);
      padding: 16px 16px 8px;
      z-index: 50;
      border-bottom: 1px solid var(--separator);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-title {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.1;
    }
    .page-actions { display: flex; gap: 8px; align-items: center; }

    .icon-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--fill);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--blue);
      transition: opacity .15s;
    }
    .icon-btn:active { opacity: .6; }
    .icon-btn svg { width: 18px; height: 18px; }

    .text-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--blue);
      font-size: 15px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: var(--rs);
    }
    .text-btn:active { opacity: .6; }

    .content { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

    /* ── CARDS ── */
    .card {
      background: var(--card);
      border-radius: var(--r);
      overflow: hidden;
    }
    .card-header {
      padding: 14px 16px 4px;
      font-size: 13px;
      font-weight: 600;
      color: var(--secondary);
      text-transform: uppercase;
      letter-spacing: .3px;
    }

    /* ── STAT ROW ── */
    .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-card {
      background: var(--card);
      border-radius: var(--r);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .stat-value { font-size: 36px; font-weight: 700; line-height: 1; }
    .stat-label { font-size: 12px; color: var(--secondary); text-align: center; }

    /* ── LIST ITEMS ── */
    .list-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--separator);
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item-body { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .list-item-title { font-size: 16px; font-weight: 500; }
    .list-item-sub {
      font-size: 13px;
      color: var(--secondary);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ── PRIORITY BAR ── */
    .priority-bar {
      width: 4px;
      height: 44px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* ── BADGE ── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    /* ── TASK CHECKBOX ── */
    .check-btn {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 2px solid var(--tertiary);
      background: none;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
      color: white;
    }
    .check-btn.done {
      background: var(--green);
      border-color: var(--green);
    }
    .check-btn svg { width: 14px; height: 14px; }

    .task-title.done {
      text-decoration: line-through;
      color: var(--secondary);
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--tertiary);
      padding: 4px;
      display: flex;
      transition: color .15s;
    }
    .delete-btn:hover { color: var(--red); }
    .delete-btn svg { width: 18px; height: 18px; }

    /* ── EMPTY STATE ── */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      gap: 12px;
      color: var(--secondary);
    }
    .empty svg { width: 48px; height: 48px; opacity: .4; }
    .empty-title { font-size: 18px; font-weight: 600; color: var(--text); }
    .empty-desc { font-size: 14px; text-align: center; }

    /* ── WEEK SCHEDULE ── */
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--separator);
    }
    .week-title { font-size: 16px; font-weight: 600; }
    .week-arrow {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--fill);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--blue);
    }
    .week-arrow svg { width: 16px; height: 16px; }

    .day-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--separator);
    }
    .day-row:last-child { border-bottom: none; }
    .day-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      width: 42px;
      flex-shrink: 0;
    }
    .day-name { font-size: 11px; color: var(--secondary); }
    .day-num {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      font-weight: 600;
    }
    .day-num.today { background: var(--blue); color: white; }
    .day-events { flex: 1; display: flex; flex-direction: column; gap: 4px; padding-top: 6px; }
    .day-empty { font-size: 13px; color: var(--tertiary); padding-top: 8px; }

    .event-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: var(--rs);
      font-size: 13px;
      cursor: pointer;
    }
    .event-chip-type {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      color: white;
      flex-shrink: 0;
    }
    .event-chip-name { font-weight: 500; flex: 1; }
    .event-chip-time { font-size: 11px; color: var(--secondary); flex-shrink: 0; }

    /* ── COLOR DOT ── */
    .color-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── COURSE CREDITS ── */
    .credits-pill {
      background: var(--fill);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 12px;
      color: var(--secondary);
      flex-shrink: 0;
    }

    /* ── MODAL ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    .overlay.open { display: flex; }
    .sheet {
      background: var(--card);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 600px;
      max-height: 92dvh;
      display: flex;
      flex-direction: column;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--separator);
      flex-shrink: 0;
    }
    .sheet-title { font-size: 17px; font-weight: 600; }
    .sheet-body { overflow-y: auto; flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }

    /* ── FORM ── */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--secondary); }
    .field input, .field textarea, .field select {
      background: var(--fill);
      border: none;
      border-radius: var(--rs);
      padding: 11px 12px;
      font-size: 16px;
      color: var(--text);
      font-family: inherit;
      direction: rtl;
      width: 100%;
      outline: none;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      outline: 2px solid var(--blue);
      outline-offset: -1px;
    }
    .field textarea { min-height: 80px; resize: vertical; }
    .field select { appearance: none; cursor: pointer; }

    .seg {
      display: flex;
      gap: 4px;
      background: var(--fill);
      border-radius: var(--rs);
      padding: 3px;
    }
    .seg-btn {
      flex: 1;
      padding: 7px 4px;
      border: none;
      border-radius: 6px;
      background: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--secondary);
      transition: all .15s;
    }
    .seg-btn.active {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,.12);
    }

    .color-picker {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
    }
    .color-swatch {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: transform .15s;
      position: relative;
    }
    .color-swatch.selected::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 2px solid var(--blue);
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--fill);
      border-radius: var(--rs);
      padding: 8px 12px;
    }
    .stepper-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--card);
      border: none;
      cursor: pointer;
      font-size: 20px;
      color: var(--blue);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
      flex-shrink: 0;
    }
    .stepper-val { flex: 1; text-align: center; font-size: 16px; font-weight: 600; }

    .btn-primary {
      background: var(--blue);
      color: white;
      border: none;
      border-radius: var(--r);
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity .15s;
      margin-top: 4px;
    }
    .btn-primary:hover { opacity: .9; }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }

    /* ── NEXT EVENT CARD ── */
    .next-event-card {
      background: linear-gradient(135deg, #007AFF 0%, #5AC8FA 100%);
      border-radius: var(--r);
      padding: 18px;
      color: white;
    }
    .next-event-label { font-size: 12px; opacity: .8; margin-bottom: 6px; }
    .next-event-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .next-event-time { font-size: 14px; opacity: .85; }

    /* ── FILTER TOGGLE ── */
    .filter-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--fill);
      border: none;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: var(--blue);
    }
    .filter-toggle svg { width: 15px; height: 15px; }

    /* ── RESPONSIVE ── */
    @media (min-width: 600px) {
      body { max-width: 600px; margin: 0 auto; }
      .stat-row { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<!-- ═══════════════ PAGES ═══════════════ -->

<!-- DASHBOARD -->
<div class="page active" id="page-dashboard">
  <div class="page-header">
    <div class="page-title">שחר לימודים</div>
  </div>
  <div class="content" id="dashboard-content"></div>
</div>

<!-- TASKS -->
<div class="page" id="page-tasks">
  <div class="page-header">
    <div class="page-title">מטלות</div>
    <div class="page-actions">
      <button class="filter-toggle" id="tasks-filter-btn" onclick="toggleTasksFilter()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
        <span id="tasks-filter-label">הושלמו</span>
      </button>
      <button class="icon-btn" onclick="openSheet('task-sheet')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>
  <div class="content" id="tasks-content"></div>
</div>

<!-- SCHEDULE -->
<div class="page" id="page-schedule">
  <div class="page-header">
    <div class="page-title">לוז</div>
    <div class="page-actions">
      <button class="text-btn" onclick="resetWeek()">היום</button>
      <button class="icon-btn" onclick="openSheet('event-sheet')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>
  <div id="schedule-content"></div>
</div>

<!-- COURSES -->
<div class="page" id="page-courses">
  <div class="page-header">
    <div class="page-title">קורסים</div>
    <div class="page-actions">
      <button class="icon-btn" onclick="openSheet('course-sheet')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>
  <div class="content" id="courses-content"></div>
</div>

<!-- ═══════════════ NAV ═══════════════ -->
<nav>
  <button class="nav-btn active" id="nav-dashboard" onclick="switchTab('dashboard')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    בית
  </button>
  <button class="nav-btn" id="nav-tasks" onclick="switchTab('tasks')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    מטלות
  </button>
  <button class="nav-btn" id="nav-schedule" onclick="switchTab('schedule')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    לוז
  </button>
  <button class="nav-btn" id="nav-courses" onclick="switchTab('courses')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    קורסים
  </button>
</nav>

<!-- ═══════════════ MODALS ═══════════════ -->

<!-- ADD TASK -->
<div class="overlay" id="task-sheet" onclick="closeSheetOnBg(event,'task-sheet')">
  <div class="sheet">
    <div class="sheet-header">
      <button class="text-btn" onclick="closeSheet('task-sheet')">ביטול</button>
      <span class="sheet-title">מטלה חדשה</span>
      <button class="text-btn" id="task-save-btn" onclick="saveTask()" style="font-weight:700">שמור</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label>שם המטלה</label>
        <input type="text" id="task-title" placeholder="לדוגמה: עבודה סמינריונית">
      </div>
      <div class="field">
        <label>הערות</label>
        <textarea id="task-notes" placeholder="פרטים נוספים..."></textarea>
      </div>
      <div class="field">
        <label>תאריך הגשה</label>
        <input type="datetime-local" id="task-due">
      </div>
      <div class="field">
        <label>עדיפות</label>
        <div class="seg" id="priority-seg">
          <button class="seg-btn" data-val="low" onclick="selectSeg('priority-seg',this)">נמוך</button>
          <button class="seg-btn active" data-val="medium" onclick="selectSeg('priority-seg',this)">בינוני</button>
          <button class="seg-btn" data-val="high" onclick="selectSeg('priority-seg',this)">גבוה</button>
        </div>
      </div>
      <div class="field">
        <label>קורס</label>
        <select id="task-course">
          <option value="">ללא קורס</option>
        </select>
      </div>
      <button class="btn-primary" onclick="saveTask()">שמור מטלה</button>
    </div>
  </div>
</div>

<!-- ADD EVENT -->
<div class="overlay" id="event-sheet" onclick="closeSheetOnBg(event,'event-sheet')">
  <div class="sheet">
    <div class="sheet-header">
      <button class="text-btn" onclick="closeSheet('event-sheet')">ביטול</button>
      <span class="sheet-title">אירוע חדש</span>
      <button class="text-btn" onclick="saveEvent()" style="font-weight:700">שמור</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label>שם האירוע</label>
        <input type="text" id="event-title" placeholder="לדוגמה: שיעור אלגוריתמים">
      </div>
      <div class="field">
        <label>מיקום</label>
        <input type="text" id="event-location" placeholder="בניין / כיתה (אופציונלי)">
      </div>
      <div class="field">
        <label>סוג</label>
        <div class="seg" id="event-type-seg">
          <button class="seg-btn active" data-val="lesson" onclick="selectSeg('event-type-seg',this)">שיעור</button>
          <button class="seg-btn" data-val="exam" onclick="selectSeg('event-type-seg',this)">בחינה</button>
          <button class="seg-btn" data-val="submission" onclick="selectSeg('event-type-seg',this)">הגשה</button>
        </div>
      </div>
      <div class="field">
        <label>התחלה</label>
        <input type="datetime-local" id="event-start">
      </div>
      <div class="field">
        <label>סיום</label>
        <input type="datetime-local" id="event-end">
      </div>
      <div class="field">
        <label>קורס</label>
        <select id="event-course">
          <option value="">ללא קורס</option>
        </select>
      </div>
      <button class="btn-primary" onclick="saveEvent()">שמור אירוע</button>
    </div>
  </div>
</div>

<!-- ADD COURSE -->
<div class="overlay" id="course-sheet" onclick="closeSheetOnBg(event,'course-sheet')">
  <div class="sheet">
    <div class="sheet-header">
      <button class="text-btn" onclick="closeSheet('course-sheet')">ביטול</button>
      <span class="sheet-title">קורס חדש</span>
      <button class="text-btn" onclick="saveCourse()" style="font-weight:700">שמור</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label>שם הקורס</label>
        <input type="text" id="course-name" placeholder="לדוגמה: ניהול שרשרת אספקה">
      </div>
      <div class="field">
        <label>שם המרצה</label>
        <input type="text" id="course-lecturer" placeholder="אופציונלי">
      </div>
      <div class="field">
        <label>נקודות זכות</label>
        <div class="stepper">
          <button class="stepper-btn" onclick="changeCredits(-1)">−</button>
          <span class="stepper-val"><span id="credits-val">3</span> נק"ז</span>
          <button class="stepper-btn" onclick="changeCredits(1)">+</button>
        </div>
      </div>
      <div class="field">
        <label>צבע</label>
        <div class="color-picker" id="color-picker"></div>
      </div>
      <button class="btn-primary" onclick="saveCourse()">שמור קורס</button>
    </div>
  </div>
</div>

<!-- ═══════════════ JS ═══════════════ -->
<script>
'use strict';

// ── DATA ──────────────────────────────────────────────
const KEYS = { courses:'sc_courses', tasks:'sc_tasks', events:'sc_events' };

function load(k) { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch { return []; } }
function save(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
function uid() { return crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)+Date.now(); }

const state = {
  courses: load(KEYS.courses),
  tasks:   load(KEYS.tasks),
  events:  load(KEYS.events),
  tab: 'dashboard',
  showCompleted: false,
  weekOffset: 0,
  courseCredits: 3,
  courseColor: '#007AFF',
};

function persist() {
  save(KEYS.courses, state.courses);
  save(KEYS.tasks,   state.tasks);
  save(KEYS.events,  state.events);
}

// ── PALETTE ───────────────────────────────────────────
const PALETTE = [
  '#007AFF','#34C759','#FF3B30','#FF9500',
  '#AF52DE','#5AC8FA','#FF2D55','#A2845E',
];

const PRIORITY_COLORS = { low:'#34C759', medium:'#FF9500', high:'#FF3B30' };
const EVENT_COLORS    = { lesson:'#007AFF', exam:'#FF3B30', submission:'#FF9500' };
const EVENT_LABELS    = { lesson:'שיעור', exam:'בחינה', submission:'הגשה' };
const PRIORITY_LABELS = { low:'נמוך', medium:'בינוני', high:'גבוה' };

const HE_DAYS  = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const HE_SHORT = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const HE_MONTHS= ['ינואר','פברואר','מרץ','אפריל','מאי','יוני',
                  'יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

// ── HELPERS ───────────────────────────────────────────
function fmt(date, opts) {
  if (!date) return '';
  const d = typeof date === 'string' ? new Date(date) : date;
  if (isNaN(d)) return '';
  if (opts === 'date') return `${d.getDate()} ${HE_MONTHS[d.getMonth()]}`;
  if (opts === 'time') return d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  if (opts === 'datetime') return fmt(d,'date') + ' ' + fmt(d,'time');
  return d.toLocaleDateString('he-IL');
}

function isToday(date) {
  const d = new Date(date), t = new Date();
  return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate();
}
function isSameDay(a, b) {
  const da = new Date(a), db = new Date(b);
  return da.getFullYear()===db.getFullYear() && da.getMonth()===db.getMonth() && da.getDate()===db.getDate();
}
function isPast(date) { return new Date(date) < new Date(); }
function isTomorrow(date) {
  const d = new Date(date), t = new Date();
  t.setDate(t.getDate()+1);
  return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate();
}

function courseById(id) { return state.courses.find(c => c.id === id); }

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── WEEK CALCULATION ──────────────────────────────────
function getWeekDates(offset) {
  const today = new Date();
  const dow = today.getDay(); // 0=Sun
  const sunday = new Date(today);
  sunday.setDate(today.getDate() - dow + offset * 7);
  sunday.setHours(0,0,0,0);
  return Array.from({length:7}, (_,i) => {
    const d = new Date(sunday);
    d.setDate(sunday.getDate() + i);
    return d;
  });
}

// ── TAB SWITCHING ─────────────────────────────────────
function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
  render();
}

// ── RENDER ────────────────────────────────────────────
function render() {
  if (state.tab === 'dashboard') renderDashboard();
  if (state.tab === 'tasks')     renderTasks();
  if (state.tab === 'schedule')  renderSchedule();
  if (state.tab === 'courses')   renderCourses();
}

// DASHBOARD
function renderDashboard() {
  const pending = state.tasks.filter(t => !t.isCompleted).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
  const now = new Date();
  const weekEnd = new Date(now); weekEnd.setDate(now.getDate()+7);
  const eventsThisWeek = state.events.filter(e => new Date(e.startDate) >= now && new Date(e.startDate) <= weekEnd).length;
  const upcoming = pending.filter(t => { const d=new Date(t.dueDate); return d <= new Date(now.getTime()+2*86400000); }).slice(0,5);
  const nextEvent = state.events.filter(e => new Date(e.startDate) >= now).sort((a,b)=>new Date(a.startDate)-new Date(b.startDate))[0];

  let html = `<div class="stat-row">
    <div class="stat-card">
      <div class="stat-value" style="color:var(--orange)">${pending.length}</div>
      <div class="stat-label">מטלות פתוחות</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:var(--blue)">${eventsThisWeek}</div>
      <div class="stat-label">אירועים השבוע</div>
    </div>
  </div>`;

  if (nextEvent) {
    html += `<div class="next-event-card">
      <div class="next-event-label">האירוע הבא</div>
      <div class="next-event-title">${escHtml(nextEvent.title)}</div>
      <div class="next-event-time">${fmt(nextEvent.startDate,'datetime')}${nextEvent.location?' · '+escHtml(nextEvent.location):''}</div>
    </div>`;
  }

  if (upcoming.length > 0) {
    html += `<div class="card"><div class="card-header">מטלות קרובות</div>`;
    upcoming.forEach(t => {
      const course = courseById(t.courseId);
      const col = PRIORITY_COLORS[t.priority] || '#8E8E93';
      const dueCol = isPast(t.dueDate) ? 'var(--red)' : isTomorrow(t.dueDate) ? 'var(--orange)' : 'var(--secondary)';
      html += `<div class="list-item">
        <div class="list-item-body">
          <div class="list-item-title">${escHtml(t.title)}</div>
          <div class="list-item-sub">
            ${course?`<span style="color:${course.colorHex}">${escHtml(course.name)}</span>`:''}
            <span style="color:${dueCol}">${fmt(t.dueDate,'datetime')}</span>
          </div>
        </div>
        <div class="priority-bar" style="background:${col}"></div>
      </div>`;
    });
    html += `</div>`;
  } else if (state.tasks.length === 0) {
    html += emptyState('checklist','אין מטלות עדיין','לחץ על לשונית מטלות כדי להוסיף');
  }

  document.getElementById('dashboard-content').innerHTML = html;
}

// TASKS
function renderTasks() {
  const list = state.tasks
    .filter(t => state.showCompleted ? t.isCompleted : !t.isCompleted)
    .sort((a,b) => new Date(a.dueDate)-new Date(b.dueDate));

  const filterBtn = document.getElementById('tasks-filter-btn');
  const filterLabel = document.getElementById('tasks-filter-label');
  if (filterLabel) filterLabel.textContent = state.showCompleted ? 'פתוחות' : 'הושלמו';

  let html = '';
  if (list.length === 0) {
    html = emptyState('checklist', state.showCompleted ? 'אין מטלות שהושלמו' : 'אין מטלות פתוחות',
      state.showCompleted ? '' : 'לחץ על + כדי להוסיף מטלה');
  } else {
    html = `<div class="card">`;
    list.forEach(t => {
      const course = courseById(t.courseId);
      const col = PRIORITY_COLORS[t.priority] || '#8E8E93';
      const dueCol = t.isCompleted ? 'var(--secondary)' : isPast(t.dueDate) ? 'var(--red)' : isTomorrow(t.dueDate) ? 'var(--orange)' : 'var(--secondary)';
      html += `<div class="list-item">
        <button class="check-btn ${t.isCompleted?'done':''}" onclick="toggleTask('${t.id}')">
          ${t.isCompleted?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>':''}
        </button>
        <div class="list-item-body">
          <div class="list-item-title task-title ${t.isCompleted?'done':''}">${escHtml(t.title)}</div>
          <div class="list-item-sub">
            ${course?`<span style="color:${course.colorHex}">${escHtml(course.name)}</span>`:''}
            <span style="color:${dueCol}">${fmt(t.dueDate,'datetime')}</span>
            <span class="badge" style="background:${col}22;color:${col}">${PRIORITY_LABELS[t.priority]||''}</span>
          </div>
          ${t.notes?`<div style="font-size:13px;color:var(--secondary);margin-top:2px">${escHtml(t.notes)}</div>`:''}
        </div>
        <div class="priority-bar" style="background:${col}"></div>
        <button class="delete-btn" onclick="deleteTask('${t.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>`;
    });
    html += `</div>`;
  }

  document.getElementById('tasks-content').innerHTML = html;
}

// SCHEDULE
function renderSchedule() {
  const days = getWeekDates(state.weekOffset);
  const monthLabel = `${HE_MONTHS[days[0].getMonth()]} ${days[0].getFullYear()}`;

  let html = `<div class="card" style="margin:16px">
    <div class="week-nav">
      <button class="week-arrow" onclick="changeWeek(1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="week-title">${monthLabel}</span>
      <button class="week-arrow" onclick="changeWeek(-1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>`;

  days.forEach(day => {
    const dayEvents = state.events
      .filter(e => isSameDay(e.startDate, day))
      .sort((a,b)=>new Date(a.startDate)-new Date(b.startDate));
    const todayCls = isToday(day) ? ' today' : '';

    html += `<div class="day-row">
      <div class="day-label">
        <span class="day-name">${HE_SHORT[day.getDay()]}</span>
        <span class="day-num${todayCls}">${day.getDate()}</span>
      </div>
      <div class="day-events">`;

    if (dayEvents.length === 0) {
      html += `<span class="day-empty">אין אירועים</span>`;
    } else {
      dayEvents.forEach(e => {
        const col = EVENT_COLORS[e.eventType] || '#007AFF';
        html += `<div class="event-chip" style="background:${col}18;border:1px solid ${col}44">
          <span class="event-chip-type" style="background:${col}">${EVENT_LABELS[e.eventType]||e.eventType}</span>
          <span class="event-chip-name">${escHtml(e.title)}</span>
          <span class="event-chip-time">${fmt(e.startDate,'time')}</span>
          <button class="delete-btn" onclick="deleteEvent('${e.id}')" style="margin-right:2px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>`;
      });
    }
    html += `</div></div>`;
  });

  html += `</div>`;
  document.getElementById('schedule-content').innerHTML = html;
}

// COURSES
function renderCourses() {
  let html = '';
  if (state.courses.length === 0) {
    html = emptyState('book', 'אין קורסים', 'לחץ על + כדי להוסיף קורס');
  } else {
    html = `<div class="card">`;
    state.courses.forEach(c => {
      const taskCount = state.tasks.filter(t => t.courseId === c.id && !t.isCompleted).length;
      html += `<div class="list-item">
        <div class="color-dot" style="background:${c.colorHex}"></div>
        <div class="list-item-body">
          <div class="list-item-title">${escHtml(c.name)}</div>
          <div class="list-item-sub">
            ${c.lecturer ? `<span>${escHtml(c.lecturer)}</span>` : ''}
            ${taskCount > 0 ? `<span style="color:var(--orange)">${taskCount} מטלות פתוחות</span>` : ''}
          </div>
        </div>
        <span class="credits-pill">${c.credits} נק"ז</span>
        <button class="delete-btn" onclick="deleteCourse('${c.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>`;
    });
    html += `</div>`;
  }
  document.getElementById('courses-content').innerHTML = html;
}

function emptyState(icon, title, desc) {
  const icons = {
    checklist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  };
  return `<div class="empty">${icons[icon]||''}<div class="empty-title">${title}</div>${desc?`<div class="empty-desc">${desc}</div>`:''}</div>`;
}

// ── ACTIONS ───────────────────────────────────────────
function toggleTask(id) {
  const t = state.tasks.find(t => t.id === id);
  if (t) { t.isCompleted = !t.isCompleted; persist(); render(); }
}
function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  persist(); render();
}
function deleteEvent(id) {
  state.events = state.events.filter(e => e.id !== id);
  persist(); render();
}
function deleteCourse(id) {
  if (!confirm('למחוק את הקורס? המטלות הקשורות אליו יישארו ללא קורס.')) return;
  state.courses = state.courses.filter(c => c.id !== id);
  state.tasks.forEach(t => { if (t.courseId === id) t.courseId = ''; });
  persist(); render();
}
function toggleTasksFilter() {
  state.showCompleted = !state.showCompleted;
  renderTasks();
}
function changeWeek(dir) { state.weekOffset += dir; renderSchedule(); }
function resetWeek() { state.weekOffset = 0; renderSchedule(); }

// ── SAVE FORMS ────────────────────────────────────────
function saveTask() {
  const title = document.getElementById('task-title').value.trim();
  if (!title) { document.getElementById('task-title').focus(); return; }
  state.tasks.push({
    id: uid(),
    title,
    notes:      document.getElementById('task-notes').value.trim(),
    dueDate:    document.getElementById('task-due').value || new Date().toISOString(),
    priority:   getSegVal('priority-seg'),
    isCompleted: false,
    courseId:   document.getElementById('task-course').value,
  });
  persist();
  closeSheet('task-sheet');
  resetForm('task-title','task-notes','task-due');
  selectSegByVal('priority-seg','medium');
  render();
}

function saveEvent() {
  const title = document.getElementById('event-title').value.trim();
  if (!title) { document.getElementById('event-title').focus(); return; }
  const start = document.getElementById('event-start').value;
  const end   = document.getElementById('event-end').value || start;
  state.events.push({
    id: uid(), title,
    location:  document.getElementById('event-location').value.trim(),
    eventType: getSegVal('event-type-seg'),
    startDate: start || new Date().toISOString(),
    endDate:   end   || new Date().toISOString(),
    courseId:  document.getElementById('event-course').value,
  });
  persist();
  closeSheet('event-sheet');
  resetForm('event-title','event-location','event-start','event-end');
  selectSegByVal('event-type-seg','lesson');
  render();
}

function saveCourse() {
  const name = document.getElementById('course-name').value.trim();
  if (!name) { document.getElementById('course-name').focus(); return; }
  state.courses.push({
    id: uid(), name,
    lecturer: document.getElementById('course-lecturer').value.trim(),
    credits:  state.courseCredits,
    colorHex: state.courseColor,
  });
  persist();
  closeSheet('course-sheet');
  resetForm('course-name','course-lecturer');
  state.courseCredits = 3;
  state.courseColor = '#007AFF';
  render();
}

function resetForm(...ids) { ids.forEach(id => { const el=document.getElementById(id); if(el) el.value=''; }); }

// ── STEPPER / COLOR ───────────────────────────────────
function changeCredits(delta) {
  state.courseCredits = Math.max(1, Math.min(6, state.courseCredits + delta));
  document.getElementById('credits-val').textContent = state.courseCredits;
}
function selectColor(hex) {
  state.courseColor = hex;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.toggle('selected', s.dataset.color === hex));
}

// ── SEGMENTED CONTROL ─────────────────────────────────
function selectSeg(segId, btn) {
  document.querySelectorAll(`#${segId} .seg-btn`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
function getSegVal(segId) {
  const active = document.querySelector(`#${segId} .seg-btn.active`);
  return active ? active.dataset.val : '';
}
function selectSegByVal(segId, val) {
  const btn = document.querySelector(`#${segId} .seg-btn[data-val="${val}"]`);
  if (btn) { document.querySelectorAll(`#${segId} .seg-btn`).forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
}

// ── SHEET ─────────────────────────────────────────────
function openSheet(id) {
  populateCourseSelects();
  if (id === 'task-sheet') {
    const now = new Date(); now.setMinutes(0,0,0);
    now.setDate(now.getDate()+1);
    document.getElementById('task-due').value = now.toISOString().slice(0,16);
  }
  if (id === 'event-sheet') {
    const s = new Date(); s.setMinutes(0,0,0);
    const e = new Date(s); e.setHours(s.getHours()+2);
    document.getElementById('event-start').value = s.toISOString().slice(0,16);
    document.getElementById('event-end').value   = e.toISOString().slice(0,16);
  }
  document.getElementById(id).classList.add('open');
}
function closeSheet(id) { document.getElementById(id).classList.remove('open'); }
function closeSheetOnBg(e, id) { if (e.target === e.currentTarget) closeSheet(id); }

function populateCourseSelects() {
  ['task-course','event-course'].forEach(selId => {
    const sel = document.getElementById(selId);
    if (!sel) return;
    const cur = sel.value;
    sel.innerHTML = '<option value="">ללא קורס</option>' +
      state.courses.map(c => `<option value="${c.id}" ${c.id===cur?'selected':''}>${escHtml(c.name)}</option>`).join('');
  });
}

// ── INIT ──────────────────────────────────────────────
function initColorPicker() {
  const cp = document.getElementById('color-picker');
  cp.innerHTML = PALETTE.map(hex =>
    `<button class="color-swatch ${hex===state.courseColor?'selected':''}" data-color="${hex}"
      style="background:${hex}" onclick="selectColor('${hex}')" title="${hex}"></button>`
  ).join('');
}

initColorPicker();
render();
</script>
</body>
</html>
